<!DOCTYPE html>
<html lang="vn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Phu Nhân ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section id="man_hinh_nhap_mat_ma">

        <div class="khu_vuc_nhap_mat_ma">
            <h1>💌 MẬT MÃ 💌</h1>
            <p>Phu Nhân à , ngươi đoán xem mật mã là gì nào !</p>

            <div id="vung_hien_thi_mat_ma" aria-label="Vùng hiển thị mật mã">
                <span id="noi_dung_mat_ma"></span>
            </div>

            <div class="ban_phim">
                <button class="nut_ban_phim" data-number="1">1</button>
                <button class="nut_ban_phim" data-number="2">2</button>
                <button class="nut_ban_phim" data-number="3">3</button>
                <button class="nut_ban_phim" data-number="4">4</button>
                <button class="nut_ban_phim" data-number="5">5</button>
                <button class="nut_ban_phim" data-number="6">6</button>
                <button class="nut_ban_phim" data-number="7">7</button>
                <button class="nut_ban_phim" data-number="8">8</button>
                <button class="nut_ban_phim" data-number="9">9</button>

                <button class="nut_ban_phim nut_khac" id="nut_xoa" type="button">
                    Xóa
                </button>

                <button class="nut_ban_phim" data-number="0">0</button>

                <button class="nut_ban_phim nut_khac" id="nut_gui" type="button">
                    Gửi
                </button>
                
            </div>

            <p id="goi_y" aria-live="co the thay doi">
                    Gợi ý: Hôm Nay  ❤️
            </p>

        </div>
    </section>

    <section id="man_hinh_trai_tim">
        <p class="thong_bao">
            🌹 cho ngươi đồ tốt nè 🌹
        </p>
        <div class="hinh_trai_tim">

            <div class="Ten_Phu_Nhân">
                <span>Phu</span>
                <span>Nhân</span>
            </div>

            <button 
                class="trai_tim" 
                id="trai_tim" 
                aria-label="nhấn vào trái tim"
            >
                ❤️
            </button>

            <div class="Ten_Ta">
                <span>Hoàng</span>
                <span>Anh</span>
                <span>Dũng</span>
            </div>

        </div>

        <h1 id="loi_chuc">
            CHÚC PHU NHÂN CỦA TA 20 THÁNG 10 VUI VẺ ❤️
        </h1>

        <p id="thong_bao_2">
            Chạm vào trái tim để nhận quà nhé Phu Nhân ❤️
        </p>

        
    </section>
    
    <audio id="nhac_bai_1" loop> <source src="nhac/CHỚP MẮT ĐÃ NGÀN NĂM.mp3" type="audio/mpeg"> </audio> 
    <audio id="nhac_bai_2" loop> <source src="nhac/NGƯỢC DÒNG THỜI KHÔNG.mp3" type="audio/mpeg"> </audio>

    <script src="script.js"></script>
</body>
</html>
